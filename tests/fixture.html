<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/module.css">
    <style>
        :root { font-size: 16px; color-scheme: dark; --golden: #f3c267; --dark-blue: #18162e; }
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #board { position: fixed; inset: 0; width: 100%; height: 100%; background: #353841; }
        #sidebar { position: fixed; top: 0; right: 0; bottom: 0; width: 180px; background: #22242b; }
        #dh-card-deck { --card-width: 160px; --bottomMargin: 0px; --borderMargin: 0px; }
        .dh-card { width: var(--card-width); height: calc(var(--card-width) * 1.4); border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column; }
        .dh-card-header { min-height: 98px; background: linear-gradient(135deg, #275b73, #8d565e); }
        .dh-card article { padding: 10px; }
        .dh-card article header { font-weight: bold; margin-bottom: 8px; }
        .dh-card p { margin: 0; font-size: 12px; }
        button { min-height: 28px; border: 1px solid; border-radius: 4px; padding: 4px 8px; }
        .fixture-settings-window { position: fixed; z-index: 300; left: 340px; top: 30px; width: 540px;
            background: #24232d; color: #efe6d8; border: 1px solid #807047; border-radius: 8px; padding: 16px; }
    </style>
</head>
<body>
    <canvas id="board"></canvas>
    <aside id="sidebar"></aside>
    <script type="module" src="/fixture.js"></script>
</body>
</html>
